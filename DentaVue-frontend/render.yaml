# Render Blueprint — DentaVue web (Next.js 16, App Router).
#
# NOTE: the service `name` below IS the hostname — `dentavue-web` produces
# https://dentavue-web.onrender.com. Four values across these two blueprints
# must always agree, so change them together or the deployed app breaks CORS
# and OAuth: this file's NEXT_PUBLIC_API_BASE_URL and NEXT_PUBLIC_APP_URL, and
# the backend's CORS_ORIGINS and WEB_APP_URL.
#
# These names were changed with the DentaVue rename because this deploys to a
# NEW Render instance — the old lumora-* services are unaffected. Renaming a
# service that is already live would move its URL instead.
#
# Deploy: push this repo to GitHub, then in Render → New → Blueprint, select it.
# It runs a Node web service (`next start`) — the App Router needs a server, so
# this is NOT a static site.
#
# IMPORTANT: NEXT_PUBLIC_* vars are inlined into the bundle at BUILD time, so
# NEXT_PUBLIC_API_BASE_URL must be correct before the build runs. If you change
# it later, trigger a fresh deploy (a rebuild), not just a restart.
#
# PORT is injected by Render; `next start` reads it automatically.
services:
  - type: web
    name: dentavue-web
    runtime: node
    # starter, not free: the free tier spins the service down after inactivity,
    # and a cold Next server takes long enough that the first request can time
    # out. Starter also keeps the health check below meaningful.
    plan: starter
    region: oregon
    # The branch carrying the DentaVue rename. Anything older (develop,
    # ai-integration) still says Lumora and would serve a Lumora-branded build
    # at the dentavue-* URLs above.
    branch: dentavue-develop
    # --include=dev is REQUIRED: NODE_ENV=production (below) applies during the
    # build too, and without this flag `npm ci` omits devDependencies — which is
    # where typescript, @types/* and the Tailwind/build tooling live, so `next
    # build` fails. The flag forces them in for the build; runtime stays prod.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production

      # Pinned so the deploy matches local dev. package.json only says
      # ">=20.9.0", which lets Render drift onto a newer major on any rebuild —
      # a class of failure that appears months later with no code change.
      - key: NODE_VERSION
        value: "24"

      # Backend API base URL — INCLUDES the /v1 prefix (the API mounts routes
      # there). Point this at your deployed backend service.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://dentavue-backend.onrender.com/v1

      # This web app's own origin (used for OAuth callback URLs).
      - key: NEXT_PUBLIC_APP_URL
        value: https://dentavue-web.onrender.com

      # DO NOT set NEXT_PUBLIC_MOCK_PHONE_OTP in a deployed build — it fabricates
      # sessions and is an auth bypass. Phone OTP simply won't work until SMS is
      # configured in Supabase; email sign-in works regardless.
