# Render Blueprint — DentaVue backend (Express API).
#
# NOTE: the service `name` below IS the hostname — `dentavue-backend` produces
# https://dentavue-backend.onrender.com. See the same note in the web repo's
# render.yaml: four values across the two blueprints must change together, and
# these were renamed because this deploys to a NEW Render instance.
#
# Deploy: push this repo to GitHub, then in Render → New → Blueprint, select it.
# Render reads this file and creates the service. Fill the `sync: false` secrets
# when prompted (or under the service's Environment tab afterwards).
#
# NOTE: PORT is injected by Render and read via process.env.PORT — do NOT set it
# here. API_PREFIX defaults to /v1 in code, so it is omitted too.
services:
  - type: web
    name: dentavue-backend
    runtime: node
    # starter, not free: the free tier spins down after inactivity, and the
    # in-memory rate-limit store (src/middlewares/rateLimit.ts) resets with the
    # process — so on free, limits silently reset every time the service wakes.
    plan: starter
    region: oregon
    # The branch carrying the DentaVue rename. See the same note in the web
    # repo's render.yaml — both services must deploy the same line.
    branch: dentavue-develop
    # --include=dev is REQUIRED: NODE_ENV=production (below) applies during the
    # build too, and without this flag `npm ci` omits devDependencies — which is
    # where typescript and every @types/* package live, so `tsc` fails on missing
    # types. The flag forces them in for the build; the RUNTIME stays production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Pinned so the deploy matches local dev — see the same note in the web
      # repo's render.yaml.
      - key: NODE_VERSION
        value: "24"

      # Cross-site cookies: the web app and this API are on different
      # *.onrender.com sites (the Public Suffix List treats each as its own
      # site), so the refresh cookie must be SameSite=None to be sent. Secure is
      # already on in production. Set to 'lax' only if you later host both under
      # one registrable domain (e.g. app./api.yourdomain.com).
      - key: COOKIE_SAMESITE
        value: none

      # Allowed browser origin(s), comma-separated. MUST equal the web URL.
      - key: CORS_ORIGINS
        value: https://dentavue-web.onrender.com
      # Where OAuth returns the user; also add it to Supabase → Auth → URL config.
      - key: WEB_APP_URL
        value: https://dentavue-web.onrender.com

      # AI layer (optional — omit GEMINI_API_KEY to run with analysis disabled).
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MEDIA_RESOLUTION
        value: MEDIUM
      - key: AI_ANALYSIS_ENABLED
        value: "true"

      # Secrets — set in the dashboard, never commit. Same Supabase project as dev
      # (migrations already applied there).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
