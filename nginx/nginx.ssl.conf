events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    # Docker embedded DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    upstream frontend_v2_upstream {
        server frontend:3000;
    }

    upstream backend_v2_upstream {
        server backend:4000;
    }

    # HTTP server: internal healthcheck + redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name dentavue.co.uk www.dentavue.co.uk dev.dentavue.co.uk _;

        location = /health {
            proxy_pass http://backend_v2_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # 1. VERSION 1 (Main Production Domain: https://www.dentavue.co.uk)
    # =========================================================================
    server {
        listen 443 ssl;
        server_name dentavue.co.uk www.dentavue.co.uk;

        ssl_certificate     /etc/letsencrypt/live/dentavue.co.uk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dentavue.co.uk/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /health {
            set $v1_backend http://dentavue-backend-v1:4000;
            proxy_pass $v1_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v1/ {
            set $v1_backend http://dentavue-backend-v1:4000;
            proxy_pass $v1_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location / {
            set $v1_frontend http://dentavue-frontend-v1:3000;
            proxy_pass $v1_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================================
    # 2. VERSION 2 (Dev Subdomain: https://dev.dentavue.co.uk AND Port :8080)
    #    Upgraded Guided Camera + Internal Image Enhancer + Precision AI Engine
    # =========================================================================
    server {
        listen 443 ssl;
        listen 8080 ssl;
        server_name dev.dentavue.co.uk;

        ssl_certificate     /etc/letsencrypt/live/dentavue.co.uk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dentavue.co.uk/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        error_page 497 https://$host:8080$request_uri;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location = /health {
            proxy_pass http://backend_v2_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /v1/ {
            proxy_pass http://backend_v2_upstream/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://frontend_v2_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
